name: Quality Gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze

      - name: Install ObjectBox native library (for real-store tests)
        run: |
          mkdir -p "$RUNNER_TEMP/objectbox"
          curl -sSL https://github.com/objectbox/objectbox-c/releases/download/v5.1.0/objectbox-linux-x64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/objectbox"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/objectbox/lib" >> "$GITHUB_ENV"

      - name: Run tests
        run: flutter test
