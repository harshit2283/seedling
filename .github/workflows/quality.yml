name: Quality Gates

on:
  pull_request:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

# One run per branch/PR: a new push cancels the run it replaces.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned so analyzer, formatter and golden rasterisation don't
          # change under us. Bump deliberately (and re-run goldens on Linux).
          flutter-version: 3.47.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze

      - name: Palette check
        run: bash scripts/check_palette.sh

      - name: Install ObjectBox native library (for real-store tests)
        run: |
          mkdir -p "$RUNNER_TEMP/objectbox"
          curl -sSL https://github.com/objectbox/objectbox-c/releases/download/v5.1.0/objectbox-linux-x64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/objectbox"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/objectbox/lib" >> "$GITHUB_ENV"

      - name: Run tests
        run: flutter test

  # The Swift and Kotlin code (CloudKit sync, transcription, widgets, file
  # protection) is not exercised by `flutter test`. These jobs at least prove
  # it compiles on every push. Free for public repositories.
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - name: Build debug APK (compiles Kotlin plugins)
        run: flutter build apk --debug

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - name: Build for the iOS simulator (compiles Swift plugins + widget)
        run: flutter build ios --simulator --debug --no-codesign
