name: Quality Gates

on:
  pull_request:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

# One run per branch/PR: a new push cancels the run it replaces.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned so analyzer, formatter and golden rasterisation don't
          # change under us. Bump deliberately (and re-run goldens on Linux).
          flutter-version: 3.47.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze

      - name: Palette check
        run: bash scripts/check_palette.sh

      - name: Generated database code is up to date
        run: |
          dart run build_runner build
          git diff --exit-code -- lib/data/datasources/local/schema.g.dart

      # Database tests run on a real SQLCipher file: package:sqlite3's build
      # hook fetches its SQLCipher build (checked against pinned sha256
      # hashes) and links the runner's OpenSSL (libcrypto.so.3).
      - name: Run tests
        run: flutter test

  # The Swift and Kotlin code (CloudKit sync, transcription, widgets, file
  # protection) is not exercised by `flutter test`. These jobs at least prove
  # it compiles on every push. Free for public repositories.
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - name: Build debug APK (compiles Kotlin plugins)
        run: flutter build apk --debug

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - name: Build for the iOS simulator (compiles Swift plugins + widget)
        run: flutter build ios --simulator --debug --no-codesign
